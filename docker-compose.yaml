services:
  db:
    image: postgres:16-alpine
    container_name: app_postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "100.76.9.25:5432:5432"
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge